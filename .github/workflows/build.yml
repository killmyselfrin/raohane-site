name: Website build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl --silent --show-error --fail-with-body \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @- \
            https://api.indexnow.org/indexnow <<'JSON'
          {
            "host": "killmyselfrin.github.io",
            "key": "8f4c2a7d91b6e3f0c5a8d2b7e1f4a963",
            "keyLocation": "https://killmyselfrin.github.io/raohane-site/8f4c2a7d91b6e3f0c5a8d2b7e1f4a963.txt",
            "urlList": [
              "https://killmyselfrin.github.io/raohane-site/",
              "https://killmyselfrin.github.io/raohane-site/features/",
              "https://killmyselfrin.github.io/raohane-site/showcase/",
              "https://killmyselfrin.github.io/raohane-site/install/",
              "https://killmyselfrin.github.io/raohane-site/docs/",
              "https://killmyselfrin.github.io/raohane-site/dependencies/",
              "https://killmyselfrin.github.io/raohane-site/changelog/",
              "https://killmyselfrin.github.io/raohane-site/ru/",
              "https://killmyselfrin.github.io/raohane-site/ru/features/",
              "https://killmyselfrin.github.io/raohane-site/ru/showcase/",
              "https://killmyselfrin.github.io/raohane-site/ru/install/",
              "https://killmyselfrin.github.io/raohane-site/ru/docs/",
              "https://killmyselfrin.github.io/raohane-site/ru/dependencies/",
              "https://killmyselfrin.github.io/raohane-site/ru/changelog/"
            ]
          }
          JSON
